<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        var themes = ['dark', 'light', 'blue', 'green', 'orange', 'red', 'slate'];
        var theme = 'dark';
        try { var stored = localStorage.getItem('pd-rp-guide-theme'); if (themes.indexOf(stored) !== -1) theme = stored; } catch (_) {}
        document.documentElement.className = theme;
        document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark';
      })();
    </script>
    <title>PD RP Guide | Law Enforcement Roleplay</title>
    <meta name="description" content="A comprehensive guide for law enforcement roleplay on GTA RP servers. Explore 10-codes, SOPs, penal codes, amendments, and more for an immersive and accurate roleplay experience." />
    <meta name="author" content="Aarsch (AmorCiTO)" />
    <meta name="keywords" content="GTA RP, roleplay, law enforcement, police guide, 10 codes, SOP, penal codes, amendments, case laws, roleplay guide, gaming, police procedures, server rules, law enforcement simulation" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
